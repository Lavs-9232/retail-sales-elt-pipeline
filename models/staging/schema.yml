version: 2

sources:
  - name: raw
    database: RETAIL_DB
    schema: RAW
    tables:
      - name: customers
      - name: products
      - name: orders
      - name: order_items

models:

  - name: stg_customers
    columns:
      - name: customer_id
        data_tests:
          - not_null
          - unique

  - name: stg_products
    columns:
      - name: product_id
        data_tests:
          - not_null
          - unique

  - name: stg_orders
    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique

  - name: stg_order_items
    columns:
      - name: order_item_id
        data_tests:
          - not_null
          - unique

  - name: dim_customers
    columns:
      - name: customer_id
        data_tests:
          - not_null
          - unique

  - name: dim_products
    columns:
      - name: product_id
        tests:
          - not_null
          - unique

  - name: fct_sales
    columns:
      - name: order_item_id
        tests:
          - not_null
          - unique
      - name: order_id
        tests:
          - not_null
      - name: customer_id
        tests:
          - not_null
      - name: product_id
        tests:
          - not_null

  - name: sales_summary
    columns:
      - name: order_date
        tests:
          - not_null